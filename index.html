<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./public/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.min.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
        }
      }
    </script>
    <title>virtual-art-gallery</title>
  </head>
  <body>
    <div id="app">
      <div class="gallery-container">
        <div class="loading-overlay" id="loading-overlay">
          <div class="loading-stage">
            <div class="loading-visual" id="loading-visual" role="status" aria-label="Loading gallery">
              <div
                class="loading-progress"
                id="loading-progress"
                role="progressbar"
                aria-label="Gallery loading progress"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
              >
                <span class="loading-progress-fill" id="loading-progress-fill"></span>
              </div>
              <span class="loading-progress-label" id="loading-progress-label">0%</span>
            </div>
            <button class="loading-button" id="loading-button" type="button" hidden>
              Enter Gallery
            </button>
          </div>
        </div>
        <div class="controls-overlay" hidden>
          <h3>Virtual Art Gallery</h3>
          <p class="desktop-controls-hint">Use <strong>W, A, S, D</strong> or <strong>Arrow Keys</strong> to walk around. Move mouse to look around.</p>
          <p class="mobile-controls-hint">Drag to look around. Use the joystick to walk.</p>
          <div class="mobile-joystick" role="group" aria-label="Movement joystick">
            <span class="mobile-joystick-knob" aria-hidden="true"></span>
          </div>
        </div>
      </div>
    </div>
    <script>
      const galleryContainer = document.querySelector('.gallery-container')

      if (window.location.protocol === 'file:') {
        galleryContainer.innerHTML = `
          <div class="local-file-notice">
            <h1>Open the gallery over HTTP</h1>
            <p>Browsers block local image textures in WebGL when this page is opened directly from a file.</p>
            <p>Run <code>python3 -m http.server 8000</code> in the project folder, then open <a href="http://localhost:8000">http://localhost:8000</a>.</p>
          </div>
        `
      } else {
        import('./src/gallery.js').catch((error) => {
          console.error('Could not start the gallery:', error)
        })
      }
    </script>
  </body>
</html>
